name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # The installation and its tests target macOS (launchd, plutil, zsh).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # rust-toolchain.toml pins the compiler and the wasm32 target.
      - run: rustup show active-toolchain
      - name: wasm-bindgen (the version scripts/build-wasm.mjs requires)
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --root .tools-root && mkdir -p .tools && cp .tools-root/bin/wasm-bindgen .tools/
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:wasm
      - run: npm run lint
      - run: npm test
      - run: npm run test:rust
